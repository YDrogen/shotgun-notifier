          - generic [ref=e67]: Description
          - generic [ref=e69]: "🇫🇷 ENERGY FESTIVAL REVIENT LE 03 MAI AVEC UN CONCEPT EXPLOSIF : \"DUALITY\" Prépare-toi à une nuit de battles épiques ! Deux DJ’s, un ring, un seul vainqueur. ⚡ Mix contre mix, ils s’affrontent pour faire vibrer la foule, et c’est toi seul qui décideras du champion à chaque duel! 👊 Un total de 87 artistes dispersés dans 3 salles différentes! Le 03 mai, entre dans l’arène. \"DUALITY\" : une soirée, deux énergies, une expérience unique. 🔥 🇬🇧 ENERGY FESTIVAL RETURNS ON MAY 3RD WITH AN EXPLOSIVE CONCEPT: \"DUALITY\" Get ready for a night of epic battles! Two DJs, one ring, one winner. ⚡ Mix against mix, they’ll go head-to-head to ignite the crowd, and you alone will decide the champion of each duel! 👊 On May 3rd, step into the arena. \"DUALITY\": one night, two energies, a unique experience. 🔥 ⭐️LINE UP⭐️ Act Of Rage vs Hard Driver / Krowdexx vs Toza / Adaro vs Rejecta / The Purge vs The Saints / Malice vs Kenai / R3trix vs Miss Pepper / Sub Sonik vs Strike Blood / Vexxed vs Sanctuary / Bassbrain vs LNY TNZ / Killshot vs Rvage / Omni vs Rawpvck / Physika vs Unvizion N-Vitral vs Deadly Guns / Noxiouz vs Lekkerfaces / DRS VS MBK vs Reflexx / RAYZEN vs RDØ / X-Pense vs Revedge / Dither vs Yoshiko / Spitnoise vs Lunakorpz / F.Noize vs Soulblast / The Satan vs The Immortal / Nrki vs Sandy Warez / Guizcore vs STV Dr. Peacock / Billx / D-Fence vs Juliëx / Promo vs Panic / Sakyra vs Dark Phoenix / Vernex vs Toxic Twins / Neophyte vs The Viper / Why T vs Raiden / Korsakoff vs Tha Playah / Seak vs Tony V Papi Jumper vs Davoodi & Bestien / Ronald V vs Loic D / Demoniak vs Lethal MG / Invictus vs Teka B / Dark E vs Miss Puss / Greg C vs Binum / Ruthless vs Potato 📌 Place/Lieu: LOTTO MONS EXPO (Mons - Belgique) Temps de route approximatif: ❚ 30 min: TOURNAI 🇧🇪 / VALENCIENNES - MAUBEUGE 🇫🇷 ❚ 1H00: NAMUR - KORTRIJK 🇧🇪 ❚ 1H30-02H00: AMIENS 🇫🇷 / BREDA - MAASTRICHT 🇳🇱 / HASSELT - GEBRUIK - OOSTENDE - ANTWERPEN 🇧🇪 ❚ 02H00 - 03H00: REIMS - ROUEN - PARIS - METZ 🇫🇷 / AMSTERDAM 🇳🇱 / LUXEMBOURG 🇱🇺"
